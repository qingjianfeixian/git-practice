<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FastAPI Demo</title>
</head>
<body>
    <h1>FastAPI 前后端测试</h1>
    <button onclick="fetchData()">请求后端</button>
    <p id="result">点击按钮获取数据...</p>

    <script>
        async function fetchData() {
            try {
                const res = await fetch('http://127.0.0.1:8000/');
                const data = await res.json();
                document.getElementById('result').innerText = JSON.stringify(data);
            } catch (err) {
                document.getElementById('result').innerText = '请求失败，请确认后端已启动';
            }
        }
    </script>
</body>
</html>
