name: FastAPI Automated Testing

# 触发条件：当有代码 push 到 main 分支时自动触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # 让 GitHub 启动一台全新的 Ubuntu Linux 服务器来跑任务
    runs-on: ubuntu-latest

    steps:
    # 1. 把你的代码检出到服务器上
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 在服务器上配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安装你在 requirements.txt 里写的依赖包
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. 运行 pytest 测试用例
    - name: Run Pytest
      run: |
        python -m pytest backend/test_main.py